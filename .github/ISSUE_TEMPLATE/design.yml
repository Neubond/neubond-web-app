name: 🎨 Design
description: Request UI or visual design work
title: "[DESIGN] "
labels: ["design", "todo"]
assignees: []

body:
  - type: textarea
    id: description
    attributes:
      label: Design Description
      description: Describe the design work in detail
    validations:
      required: true

  - type: textarea
    id: inspiration
    attributes:
      label: Inspiration / References
      description: Links, screenshots, or prior art
    validations:
      required: false

  - type: textarea
    id: requirements
    attributes:
      label: Requirements / Constraints
      description: Brand, accessibility, or layout constraints
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Remarks
      description: Any additional information
    validations:
      required: false

  - type: textarea
    id: source
    attributes:
      label: Source of Feedback
      description: Where was the feedback sourced from and when?
    validations:
      required: true

  - type: textarea
    id: version
    attributes:
      label: App version
      description: The `version` field in `package.json` at time of feedback
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Device type(s)
      description: Which viewport sizes are affected?
      multiple: true
      options:
        - device-desktop
        - device-mobile
        - device-tablet
    validations:
      required: true

  - type: dropdown
    id: target
    attributes:
      label: Deployment target(s)
      description: Which deployment does this apply to?
      multiple: true
      options:
        - target-cloudflare
        - target-vercel
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How critical is this?
      multiple: false
      options:
        - priority-low
        - priority-medium
        - priority-high
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected Area(s)
      description: Select one or more affected areas
      multiple: true
      options:
        - auth
        - ifu
        - emails
        - supabase
        - ui
        - routing
        - storage
        - deployment
        - seo
        - app-wide
    validations:
      required: true
