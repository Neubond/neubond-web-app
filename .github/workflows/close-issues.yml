name: Close referenced issues

# GitHub closes issues from closing keywords only when a pull request merges into
# the default branch. This repo also ships from vercel-deploy, so merges there need
# the same behaviour applied explicitly.
#
# "Fixes #123" closes the issue. "Refs #123" deliberately does not, so a pull request
# can reference an issue it only partially advances.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write

jobs:
  close:
    name: Close issues fixed by this PR
    # main is handled natively by GitHub, so only act on the other deployment branch.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Close issues referenced with a closing keyword
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BODY: ${{ github.event.pull_request.body }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          # Same keyword family GitHub itself honours. "Refs" is intentionally absent.
          NUMS=$(printf '%s' "$BODY" \
            | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]*:?[[:space:]]*#[0-9]+' \
            | grep -oE '[0-9]+' | sort -u || true)

          if [ -z "$NUMS" ]; then
            echo "No closing keywords in the body of #$PR. Nothing to close."
            exit 0
          fi

          for n in $NUMS; do
            state=$(gh issue view "$n" --json state --jq .state 2>/dev/null || echo MISSING)
            case "$state" in
              OPEN)
                gh issue close "$n" --reason completed \
                  --comment "Closed by #$PR, merged into \`$BASE\`."
                echo "Closed #$n"
                ;;
              *)
                echo "Skipped #$n (state: $state)"
                ;;
            esac
          done
